# The pipeline (docs/delivery.md, "Pipeline"; ADR 0011). The shape follows the site's ci.yml,
# whose steps are named in plain sentences.
#
# THE LAUNCH JOBS. verify, firewall and firewall-selftest run as they have since PR 2. Every
# job below them (preview, e2e, lighthouse, preview-cleanup, deploy, prod-smoke, prod-verdict,
# rollback) runs only when the repository variable LAUNCHED is 'true' (Settings, Secrets and
# variables, Actions, Variables). Joseph set it on launch day, 2026-11-06 (docs/operations.md,
# "Launch"), and they have run since. Unsetting it, or setting anything but 'true', makes them
# dormant again, and then none of them holds a credential.
#
# Secrets, by name only, each in the env of the steps that use it (rule 2), with the Cloudflare
# permissions each job's commands need, from docs/operations.md's access setup:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (step 1, the deploy token, account-owned)
#     preview          Account: Workers Scripts Edit (a preview is a version upload), Account
#                      Settings Read (Wrangler reads the account and its workers.dev subdomain)
#     preview-cleanup  Account: Workers Scripts Edit
#     deploy           all of step 1: Account: Workers Scripts Edit, Account Settings Read, and the
#                      assumed Queues Edit (the API binds bakery-events and its consumer); Zone
#                      ihaveasegway.com: Workers Routes Edit and Zone Read (the two Custom Domains),
#                      and the assumed DNS Edit (a Custom Domain adds its record). Launch day's
#                      first deploy confirms the list (ADR 0011, decision 8)
#     rollback         Account: Workers Scripts Edit, Account Settings Read
#   STRIPE_E2E_SECRET_KEY (step 7): read by nothing yet. Until spike S3 the e2e payment step pays
#     at the fake Stripe (scripts/fake-stripe.mjs), and a key no step uses is a key no step holds.
#   CLOUDFLARE_READ_TOKEN (step 8) belongs to scheduled.yml's bakery-objects, never to this file.
#   FIREWALL_RULES (step 7, both stores): firewall, as before.
# The GitHub token: pull-requests: write for preview's one comment, issues: write for
# prod-verdict's incident issue; contents: read everywhere else.
#
# The hardening rules are delivery.md's "Hardening rules", marked where they apply. Rule 4: the
# jobs that hold the deploy token use GitHub-created actions and pnpm/action-setup only, Wrangler
# from the lockfile, and never compile Rust. Rule 11: none of them restores a cache. The launch
# jobs pin each action by commit, with its release in the comment. Rule 12 is the bakery's own:
# cargo installs are --locked and --version-pinned.
name: ci

on:
  pull_request:
    # A title or body edited later: pr-text.yml. Closed: preview-cleanup only.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1' # the weekly rebuild, Monday 07:17 UTC: off the hour, when GitHub drops fewer runs
  workflow_dispatch: # the rollback job only (docs/operations.md, "Rollback")
    inputs:
      worker:
        description: The Worker to roll back
        type: choice
        options: [web, api]
        required: true
      rollback_to:
        description: The version id to roll back to (from the prod-verdict issue or a deploy summary)
        type: string
        required: true
      reason:
        description: Why, in a few words; it becomes the deployment's message
        type: string
        required: true

permissions: {} # rule 1: each job grants only what its row in delivery.md says

concurrency:
  # Rule 8: a new push to a pull request cancels its superseded run. Every other run waits for
  # its turn in the group and is never cancelled. A dispatch (a rollback) has a group of its own,
  # so it never waits behind a whole main run; it waits only for deploy, in deploy-production.
  # A closed pull request's run (preview-cleanup's) has a group of its own too, by number: on a
  # merged pull request github.ref is the base branch, refs/heads/main, so with the shared group
  # that run cancelled the merge's own push run on main and nothing deployed (launch day,
  # 2026-11-06, run 116).
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.event_name == 'pull_request' && github.event.action == 'closed' && format('closed-pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1' # the build talks to no one it does not need
  WRANGLER_SEND_METRICS: 'false'
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # Not on a closed pull request (preview-cleanup's) or a dispatch (rollback's).
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # rule 9: a cold Rust build is slow, hence the cache below
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@v6 # no version input: pnpm reads packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rust, from rust-toolchain.toml, with the WebAssembly target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: Cache the cargo registry, git checkouts and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Cargo tool versions, read from Cargo.toml's [workspace.metadata.tools]
        id: tools
        run: |
          meta="$(cargo metadata --no-deps --format-version 1 --locked)"
          for tool in worker-build cargo-deny cargo-audit; do
            version="$(jq -r --arg t "$tool" '.metadata.tools[$t] // empty' <<<"$meta")"
            if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::cannot read an exact version for $tool from [workspace.metadata.tools]"
              exit 1
            fi
            echo "$tool=$version" >> "$GITHUB_OUTPUT"
          done
      - name: Install worker-build (rule 12, --locked and pinned)
        run: cargo install worker-build --locked --version "${{ steps.tools.outputs.worker-build }}"
      - name: Install cargo-deny (rule 12, --locked and pinned)
        run: cargo install cargo-deny --locked --version "${{ steps.tools.outputs.cargo-deny }}"
      - name: Install cargo-audit (rule 12, --locked and pinned)
        run: cargo install cargo-audit --locked --version "${{ steps.tools.outputs.cargo-audit }}"
      - run: pnpm install --frozen-lockfile
      # Rust: format, lint, test, supply chain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Licenses, advisories, bans and sources (cargo deny)
        run: cargo deny check
      # .cargo/audit.toml holds the ignore list, the same as deny.toml's, with its reason.
      - name: RustSec advisories, warnings included (cargo audit)
        run: cargo audit --deny warnings
      - name: The worker crate is pinned exactly (workers/api/Cargo.toml, through the workspace)
        run: |
          # worker is a 0.x crate, so a minor release can break; worker-build matches its version.
          if ! grep -Eq '^worker = \{ *version = "=[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml; then
            echo "::error file=Cargo.toml::worker is not pinned with = in [workspace.dependencies]"
            exit 1
          fi
          if ! grep -Eq '^worker = \{ *workspace = true' workers/api/Cargo.toml; then
            echo "::error file=workers/api/Cargo.toml::worker does not come from the workspace's exact pin"
            exit 1
          fi
          grep -E '^worker = ' Cargo.toml workers/api/Cargo.toml
      - name: The OpenAPI document is the route table's and the schemas' (apps/web/public/docs/api/openapi.json)
        run: cargo run -q --locked -p bakery-contracts --bin openapi -- --check
      # The API's bundle: built once here from scanned source, scanned by firewall, never committed
      - name: Build the API's WebAssembly (worker-build)
        working-directory: workers/api
        run: worker-build --release
      - name: Bundle the API without deploying it (the bytes firewall scans)
        working-directory: workers/api
        run: pnpm exec wrangler deploy --dry-run --outdir dist
      # The startup budget's local half (delivery.md, "Quality gates"): Wrangler's `check startup`
      # loads the scanned bundle in a local workerd and profiles its startup phase, with no
      # credential and no upload. It runs on a copy, so the artifact keeps exactly the bytes
      # firewall scans. A runner's CPU is not Cloudflare's, so the figure is a guide; the budget
      # is 500 ms, half the platform's 1 s limit. The deploy job checks Cloudflare's own figure.
      - name: The API's startup stays inside its budget (wrangler check startup, 500 ms)
        run: |
          copy="$RUNNER_TEMP/api-startup"
          rm -rf "$copy"
          cp -r workers/api/dist "$copy"
          node scripts/api-deploy-config.mjs workers/api/wrangler.jsonc "$copy"
          pnpm exec wrangler deploy --config "$copy/wrangler.json" --dry-run --outfile "$RUNNER_TEMP/api.bundle" > "$RUNNER_TEMP/api-bundle.log"
          pnpm exec wrangler check startup --worker "$RUNNER_TEMP/api.bundle" --outfile "$RUNNER_TEMP/api-startup.cpuprofile"
          # The profile's window, start to end, in microseconds: the import of the bundle and the
          # instantiation of its WebAssembly, idle samples included.
          ms="$(jq -r '(.endTime - .startTime) / 1000 | ceil' "$RUNNER_TEMP/api-startup.cpuprofile")"
          budget=500
          echo "the API's local startup profile spans $ms ms; the budget is $budget ms"
          if [ "$ms" -gt "$budget" ]; then
            echo "::error::the API's local startup profile spans $ms ms, over the startup budget of $budget ms (docs/delivery.md, \"Quality gates\")"
            exit 1
          fi
      - name: The API's WebAssembly stays inside its budget (workers/api/budgets.json, spike S1 plus 25%)
        run: |
          wasm=workers/api/build/index_bg.wasm
          size="$(stat -c %s "$wasm")"
          budget="$(jq -r '.wasm_bytes' workers/api/budgets.json)"
          echo "index_bg.wasm is $size bytes; the budget is $budget"
          if [ "$size" -gt "$budget" ]; then
            echo "::error file=workers/api/budgets.json::the API's WebAssembly, $size bytes, is over its budget of $budget bytes"
            exit 1
          fi
      # The web app: build, test, typecheck, lint, format
      # The storefront bakes the Turnstile site key into its bundle at build time: the repository
      # variable TURNSTILE_SITE_KEY (public by design; a managed widget for bakery.ihaveasegway.com,
      # operations.md step 5). Unset, the component falls back to Turnstile's test key.
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Say so when the storefront was built with Turnstile's test site key
        if: vars.TURNSTILE_SITE_KEY == ''
        run: |
          echo "::warning::the repository variable TURNSTILE_SITE_KEY is unset, so apps/web/dist carries Turnstile's test site key, which is fine for a preview and refused by the deploy job (docs/operations.md, step 5)."
      # ADR 0007, decision 2: the firewall's half of the key guard. After the builds, so the
      # storefront's bundle (apps/web/dist) and the API's (workers/api/dist) are searched too.
      # The pattern is put together from parts, so this step's text never matches it, and the
      # step's own file and docs/ (whose two sentences name the rule) are left out.
      - name: No Stripe key or signing secret in the tree or the bundles
        run: |
          # Any string shaped like a Stripe key or endpoint secret, test mode included: a
          # placeholder of that shape is what secret scanners flag, so none may exist here.
          mode="(li""ve|te""st)"
          tail="[0-9A-Za-z]{16,}"
          # A publishable key is public by design: the sandbox one is a var in wrangler.jsonc from
          # launch (operations.md step 6), so only its live form is refused here.
          pattern="((sk|rk)_${mode}_${tail}|pk_li""ve_${tail}|wh""sec_${tail})"
          for bundle in apps/web/dist workers/api/dist; do
            if [ ! -d "$bundle" ]; then
              echo "::error::$bundle is missing, so it cannot be searched"
              exit 1
            fi
          done
          if grep -rIlE "$pattern" . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.wrangler \
            --exclude=ci.yml; then
            echo "::error::a Stripe key or signing secret shape is in the files above"
            exit 1
          fi
          if grep -rlaE "$pattern" apps/web/dist workers/api/dist; then
            echo "::error::a built bundle holds a Stripe key or signing secret shape"
            exit 1
          fi
          echo "no Stripe key or secret shape in the tree (but this file) or in apps/web/dist and workers/api/dist"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Fitness functions that need no browser and no edge (delivery.md, "Quality gates")
      - name: No KV namespace in any wrangler.jsonc (cost.md, "Guardrails")
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            # trailing line comments are dropped first, as in the cache check below
            if sed -E 's#(^|[[:space:]])//.*$##' "$f" | grep -q '"kv_namespaces"'; then
              echo "::error file=$f::kv_namespaces is bound in this config; counters and flags live in Control"
              bad=1
            fi
          done < <(find . -name wrangler.jsonc -not -path '*/node_modules/*' -not -path './target/*' -print0)
          exit "$bad"
      - name: No metadata in any tracked image or PDF (scripts/image-metadata.mjs)
        run: node scripts/image-metadata.mjs --tracked
      - name: Every relative link in the docs reaches its file and heading (scripts/check-doc-links.mjs)
        run: node scripts/check-doc-links.mjs
      - name: Every script's own test passes, with fakes and no network (scripts/*.test.sh)
        # One step for all of them, so a new script test needs no change here: a pull request that
        # changes this workflow gets no preview. Today: lighthouse-pages.test.sh (the Lighthouse
        # step retries a tool error and nothing else) and wipe-check.test.sh (the morning wipe
        # check reads the status route's count).
        run: |
          for t in scripts/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
      - name: No Workers Cache in any wrangler.jsonc (it bills every asset request)
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            # trailing line comments are dropped first, so a comment that names the key is not one
            if sed -E 's#(^|[[:space:]])//.*$##' "$f" | grep -q '"cache"'; then
              echo "::error file=$f::cache is set in this config; the bakery never enables it"
              bad=1
            fi
          done < <(find . -name wrangler.jsonc -not -path '*/node_modules/*' -not -path './target/*' -print0)
          exit "$bad"
      - name: crates/domain and crates/app depend on no platform crate (cargo metadata)
        run: |
          cargo metadata --format-version 1 --locked | jq -e '
            ["worker", "worker-sys", "worker-macros", "wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys"] as $platform
            | (.resolve.nodes | map({key: .id, value: [.deps[].pkg]}) | from_entries) as $edges
            | (.packages | map({key: .id, value: .name}) | from_entries) as $name
            | [.packages[] | select(.name == "bakery-domain" or .name == "bakery-app") | .id] as $roots
            | {seen: [], todo: $roots}
            | until(.todo | length == 0;
                .todo[0] as $id
                | if (.seen | index($id)) then .todo |= .[1:]
                  else {seen: (.seen + [$id]), todo: (.todo[1:] + $edges[$id])} end)
            | [.seen[] | $name[.] | select(. as $n | $platform | index($n))] as $hits
            | if ($hits | length) == 0 then true
              else ("platform crates reachable from domain or app: " + ($hits | join(", ")) | halt_error(1)) end'
      - name: The seed is deterministic, two runs give identical bytes (docs/domain.md, "The seed")
        run: |
          cargo run -q --locked -p bakery-seed -- 42 2026-11-07 > "$RUNNER_TEMP/seed-a.json"
          cargo run -q --locked -p bakery-seed -- 42 2026-11-07 > "$RUNNER_TEMP/seed-b.json"
          cmp "$RUNNER_TEMP/seed-a.json" "$RUNNER_TEMP/seed-b.json"
          echo "seed 42, born 2026-11-07: $(wc -c < "$RUNNER_TEMP/seed-a.json") bytes, the same twice"
      - name: The storefront's menu is the seed's (apps/web/src/data/menu.json from apps/web/scripts/menu.mjs)
        run: |
          node apps/web/scripts/menu.mjs "$RUNNER_TEMP/menu.json"
          if ! cmp "$RUNNER_TEMP/menu.json" apps/web/src/data/menu.json; then
            echo "::error file=apps/web/src/data/menu.json::the committed menu is not what the seed gives; run node apps/web/scripts/menu.mjs and commit the result"
            exit 1
          fi
          echo "menu.json is the seed's menu, $(wc -c < apps/web/src/data/menu.json) bytes"
      - name: No timers or wall clock in the domain, the app or any object (workers/api/src/clock.rs is the one adapter)
        run: |
          # clock.rs sits outside these paths on purpose: it is the Clock port's only adapter.
          if grep -rnE 'setTimeout|setInterval|Date::now|SystemTime|Instant::now|js_sys::Date' \
            crates/domain crates/app workers/api/src/objects; then
            echo "::error::a timer or a wall-clock read where only the Clock port and alarms may supply time (AGENTS.md)"
            exit 1
          fi
      - name: Every Durable Object class is SQLite-backed and exported (wrangler.jsonc)
        run: |
          classes="$(grep -rh -A1 '#\[durable_object\]' workers/api/src | sed -nE 's/^pub struct ([A-Za-z0-9_]+).*/\1/p' | sort -u)"
          # Trailing line comments are dropped first, as in the cache check, then trailing commas.
          sed -E 's#(^|[[:space:]])//.*$##' workers/api/wrangler.jsonc | CLASSES="$classes" node -e '
            const text = require("fs").readFileSync(0, "utf8").replace(/,(\s*[}\]])/g, "$1");
            const config = JSON.parse(text);
            const exported = config.exports ?? {};
            const bound = (config.durable_objects?.bindings ?? []).map((b) => b.class_name);
            const classes = process.env.CLASSES.split("\n").filter(Boolean);
            const sqlite = (c) => exported[c]?.type === "durable-object" && exported[c]?.storage === "sqlite";
            const bad = [...new Set([...classes, ...bound])].filter((c) => !sqlite(c));
            if (classes.length === 0) bad.push("(no #[durable_object] found)");
            for (const c of bad) console.log(`::error file=workers/api/wrangler.jsonc::${c} is not exported with "storage": "sqlite"`);
            console.log(`classes: ${classes.join(", ")}; bindings: ${bound.join(", ")}`);
            process.exit(bad.length ? 1 : 0);
          '
      - name: Keep the build (firewall scans these bytes, never a rebuild)
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            apps/web/dist
            workers/api/dist
          include-hidden-files: true # .well-known
          if-no-files-found: error
          retention-days: 7

  firewall:
    needs: verify
    # Not on a closed pull request (preview-cleanup's) or a dispatch (rollback's).
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # rule 7
          fetch-depth: 0 # the commit range needs history; a shallow clone would hide it
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: . # the artifact holds apps/web/dist and workers/api/dist, as verify uploaded them
      - name: Content firewall (exit 1 is a finding, 2 is cannot prove clean; both stop the run)
        env:
          # Rule 2: the secret exists only in this step. A Dependabot run reads the Dependabot copy.
          GITLEAKS_CONFIG_TOML: ${{ secrets.FIREWALL_RULES }}
          FW_EVENT: ${{ github.event_name }}
          FW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # Rule 3: pull request text reaches the script through env, never through ${{ }} in run.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          DIST_DIRS: apps/web/dist:workers/api/dist
        run: scripts/firewall/check.sh

  firewall-selftest:
    # check.sh against fixture repositories with throwaway rules only, proving exits 0, 1 and 2
    # without a real term (security.md, "The content firewall here"). A job of its own beside
    # verify, as on the site: it takes minutes, and inside verify every later job would wait for it.
    # A pull request always runs it. A push to main runs it only when the push changes the scanner
    # (scripts/firewall/scanner-changed.sh): otherwise main's scanner is the one its pull request's
    # run proved. The check is a step, not a paths filter, so the job always reports a result.
    # The weekly rebuild always runs it: a new git on the runner image is the drift that run is for.
    # Not on a closed pull request (preview-cleanup's) or a dispatch (rollback's).
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # rule 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # rule 7
          fetch-depth: 0 # a push compares the scanner with the commit before it
      - name: Does this run need the self-test?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$EVENT" = push ]; then
            run="$(scripts/firewall/scanner-changed.sh "$BEFORE" HEAD)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then
            echo "::notice::No self-test: this push does not change the scanner, which its pull request's run proved."
            echo "No self-test: this push does not change the scanner, which its pull request's run proved." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Firewall self-test, with throwaway rules only
        if: steps.scope.outputs.run == 'true'
        run: scripts/firewall/test.sh

  # ---------------------------------------------------------------------------------------------
  # The launch jobs (PR 11). Each starts with vars.LAUNCHED == 'true': dormant until launch day.
  # Timeouts (rule 9) are this file's own; delivery.md names verify's 25 minutes only.
  # ---------------------------------------------------------------------------------------------

  preview:
    # The web Worker only, until spike S4 (ADR 0011, decision 4): `wrangler preview` of the
    # scanned dist/, on workers.dev with noindex, calling the production API (whose CORS allows
    # only the storefront, so signed-in screens fail there by design). Pull requests from this
    # repository only, never Dependabot's: neither gets the deploy token.
    needs: firewall
    if: >-
      vars.LAUNCHED == 'true' && github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the one comment with the preview's URL
    outputs:
      url: ${{ steps.publish.outputs.url }}
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
          fetch-depth: 0 # the scanner check compares the pull request with its base
      - name: Does this pull request change the scanner? Then no preview, since nothing has proved it yet
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(scripts/firewall/scanner-changed.sh "$BASE" HEAD)"
          if [ "$changed" = false ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            note="No preview: this pull request changes the scanner, and a scanner its self-test has not proved cannot clear a public page."
            echo "::notice::$note"
            echo "$note" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.publish == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # rule 11: no cache next to the deploy token
      - if: steps.scope.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - name: Production exists? A preview publishes nothing before the first deploy from main
        id: production
        if: steps.scope.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # rule 2: this step and Publish only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler deployments list --name bakery-web --json > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE '10007|not found|does not exist' "$RUNNER_TEMP/err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No preview: bakery-web has no production yet; the first deploy from main creates it."
          else
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi
      - name: Publish the preview (web only, the scanned dist/)
        id: publish
        if: steps.production.outputs.exists == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec wrangler preview --config apps/web/wrangler.jsonc --name "pr-$PR" \
            --message "pr-$PR@${HEAD_SHA:0:8}" --json > "$RUNNER_TEMP/preview.json"
          # The first workers.dev URL Wrangler reports (the shape held on the first preview, 2026-11-06).
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/preview.json" | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::wrangler preview reported no workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Wait for the preview, and require noindex
        if: steps.publish.outputs.url != ''
        env:
          URL: ${{ steps.publish.outputs.url }}
        run: |
          for _ in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/headers" -w '%{http_code}' "$URL/" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then
            echo "::error::the preview answered $code, not 200, within two minutes"
            exit 1
          fi
          if ! tr -d '\r' < "$RUNNER_TEMP/headers" | grep -qiE '^x-robots-tag:.*noindex'; then
            echo "::error::the preview has no X-Robots-Tag: noindex, so a search engine may index it"
            exit 1
          fi
          echo "Preview: $URL (noindex)" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the preview's URL, in one comment the job edits on each push
        if: steps.publish.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.publish.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview of the storefront at ${HEAD_SHA:0:8}: $URL (noindex; it calls the production API, so signed-in screens fail here by design)."
          gh pr comment "$PR" --repo "$REPO" --edit-last --body "$body" 2> /dev/null ||
            gh pr comment "$PR" --repo "$REPO" --body "$body"

  e2e:
    # Both Workers on wrangler dev from the scanned artifacts, with the fakes, Playwright in its
    # image at the lockfile's version (apps/web/e2e/run.mjs). Runs for Dependabot's pull requests
    # too; a fork's never gets here, because firewall fails closed without its secret.
    # STRIPE_E2E_SECRET_KEY is not read: until spike S3 the payment spec pays at the fake Stripe.
    needs: [verify, firewall, preview]
    if: >-
      always() && vars.LAUNCHED == 'true' && github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.verify.result == 'success' && needs.firewall.result == 'success' &&
      (needs.preview.result == 'success' || needs.preview.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # The lockfile's Playwright, 1.65.0 (docs/stack.md), by digest as well as tag.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host # Chromium's shared memory
    permissions:
      contents: read
    env:
      PLAYWRIGHT_IMAGE: '1.65.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # no secret in this job
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - name: The image's Playwright is the lockfile's
        run: |
          locked="$(pnpm --filter web exec playwright --version | awk '{ print $2 }')"
          echo "lockfile: $locked; image: $PLAYWRIGHT_IMAGE"
          if [ "$locked" != "$PLAYWRIGHT_IMAGE" ]; then
            echo "::error::the lockfile's Playwright is $locked and the image's $PLAYWRIGHT_IMAGE; move both together"
            exit 1
          fi
      - name: End-to-end suite, both Workers on wrangler dev with the fakes
        run: pnpm --filter web e2e
      - name: Keep the traces and the servers' logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    # Lighthouse CI against the preview, with the budgets in apps/web/lighthouserc.json. Its own
    # lockfile (tools/lighthouse), so its dependency tree stays out of the workspace's install and
    # audit. The image supplies the Chromium. Reports stay in this run (upload target filesystem).
    needs: preview
    if: vars.LAUNCHED == 'true' && needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    # Twenty-four pages at three runs each: a run took 11 to 27 s against the preview on 2026-11-08
    # (runs 146 and 147), about fifteen minutes in all after a minute of setup. Ten minutes cancelled
    # both runs during the fifteenth page.
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install Lighthouse CI from its own lockfile
        working-directory: tools/lighthouse
        run: pnpm install --frozen-lockfile
      - name: Lighthouse against the preview's pages
        working-directory: apps/web
        # The container's default shell is sh. The first run, 2026-11-06, died there on a bash array
        # with "Syntax error: ( unexpected" before Lighthouse started, so the step names bash. It
        # reads apps/web/lighthouse-pages.txt into a bash array and passes the pages as arguments to
        # scripts/lighthouse-pages.sh, which is bash too. The list is a file, not a line here,
        # because a pull request that changes this workflow gets no preview to measure.
        shell: bash
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          CHROME_PATH="$(find /ms-playwright -path '*/chrome-linux*/chrome' -type f | head -n 1)"
          export CHROME_PATH
          PATH="$PWD/../../tools/lighthouse/node_modules/.bin:$PATH"
          export PATH
          mapfile -t pages < <(grep -vE '^[[:space:]]*(#|$)' lighthouse-pages.txt)
          ../../scripts/lighthouse-pages.sh "${URL%/}" "${pages[@]}"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/lighthouse-results
          if-no-files-found: ignore
          retention-days: 7

  preview-cleanup:
    # A closed pull request's preview, deleted. The same pull requests as preview.
    if: >-
      vars.LAUNCHED == 'true' && github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # rule 11
      - run: pnpm install --frozen-lockfile
      - name: Delete the pull request's preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # rule 2
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # By Worker name, not config: the config's assets directory is not built in this job.
          if pnpm exec wrangler preview delete --worker-name bakery-web --name "pr-$PR" --skip-confirmation 2> "$RUNNER_TEMP/err"; then
            echo "Deleted the preview pr-$PR." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qiE 'not found|does not exist' "$RUNNER_TEMP/err"; then
            echo "::notice::No preview pr-$PR to delete (none was published)."
          else
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi

  deploy:
    # On a push to main (ADR 0011, decisions 5, 9 and 10). Stops unless the commit is main's tip.
    # Stage 1, the API, when workers/api/, crates/ or the Rust manifests changed since the commit
    # the live API runs (read from its deployment's message): `wrangler deploy` of the scanned
    # bundle with no build and no bundling, then a health and CORS check through its hostname.
    # Stage 2, the web Worker, after stage 1 passes or is skipped: a version upload, a smoke of its
    # Version URL, main's tip checked again, then that version at 100%. The first deploy runs
    # `wrangler deploy` for each Worker instead, which creates it and attaches its Custom Domain.
    # A Durable Object class lifecycle change ships alone: with one, any other change in the range
    # stops the job, and the web stage waits for the next merge.
    needs: [verify, firewall, firewall-selftest]
    if: vars.LAUNCHED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production # rule 8: shared with rollback, never cancelled
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.tip.outputs.go }}
      api: ${{ steps.api.outputs.deployed }}
      api_before: ${{ steps.live.outputs.api_version }}
      api_after: ${{ steps.api.outputs.version }}
      web: ${{ steps.web.outputs.deployed }}
      web_before: ${{ steps.live.outputs.web_version }}
      web_after: ${{ steps.web.outputs.version }}
      # A Worker with no version before this run gets its Custom Domain attached for the first time,
      # which waits on DNS and a certificate (Incident #41): prod-smoke then waits longer.
      first_attach: ${{ steps.tip.outputs.go == 'true' && (steps.live.outputs.api_version == '' || steps.live.outputs.web_version == '') }}
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
          fetch-depth: 0 # the API's paths are compared with the commit production runs
      - name: Stop unless this commit is main's tip
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f 1)"
          if [ "$tip" = "$SHA" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at ${tip:0:12} now, not ${SHA:0:12}; that commit's own run deploys it."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.tip.outputs.go == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.go == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # rule 11
      - if: steps.tip.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.tip.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      # The storefront bakes PUBLIC_TURNSTILE_SITE_KEY in at build time (verify, from the repository
      # variable TURNSTILE_SITE_KEY, operations.md step 5); unset, the component falls back to
      # Turnstile's always-pass test key. On 2026-11-08 the deployed bundle was found carrying that
      # key, so production's only bot check on guest sandboxes and demo accounts was the test one.
      # The deploy stops here rather than publish such a bundle again. The key below is Cloudflare's
      # documented test site key, public by design.
      - name: The storefront's bundle carries a real Turnstile site key, not the test one
        if: steps.tip.outputs.go == 'true'
        run: |
          if grep -rq '1x00000000000000000000AA' apps/web/dist; then
            echo "::error::apps/web/dist carries Turnstile's test site key, so the repository variable TURNSTILE_SITE_KEY was unset when verify built it (docs/operations.md, step 5). Set it under Settings, Secrets and variables, Actions, Variables, then rerun this workflow or push again."
            exit 1
          fi
          echo "the storefront's bundle carries a real Turnstile site key"
      - name: The API's deploy config, next to its scanned bundle (no build, no bundling)
        if: steps.tip.outputs.go == 'true'
        run: node scripts/api-deploy-config.mjs
      - name: Read what production runs now
        id: live
        if: steps.tip.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # rule 2
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Prints "<version id> <commit>" of the Worker's newest deployment, or nothing when the
          # Worker does not exist yet. The --json shape held on launch day, 2026-11-06: the re-run's
          # deploy read the live API's commit from its message and skipped stage 1.
          live() {
            if ! pnpm exec wrangler deployments list --name "$1" --json > "$RUNNER_TEMP/$1.json" 2> "$RUNNER_TEMP/$1.err"; then
              if grep -qiE '10007|not found|does not exist' "$RUNNER_TEMP/$1.err"; then return 0; fi
              cat "$RUNNER_TEMP/$1.err" >&2
              return 1
            fi
            jq -r 'sort_by(.created_on) | last // empty
              | "\(.versions[0].version_id // "") \(((.annotations["workers/message"] // "")
                  | [capture("main@(?<s>[0-9a-f]{40})")] | .[0].s) // "")"' \
              "$RUNNER_TEMP/$1.json"
          }
          api_live="$(live bakery-api)" # an error here stops the job: never a guess at production
          web_live="$(live bakery-web)"
          read -r api_version api_commit <<< "$api_live"
          read -r web_version _ <<< "$web_live"
          {
            echo "api_version=${api_version:-}"
            echo "api_commit=${api_commit:-}"
            echo "web_version=${web_version:-}"
          } >> "$GITHUB_OUTPUT"
          echo "Live before: bakery-api ${api_version:-none} (main@${api_commit:0:8}), bakery-web ${web_version:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Did the API change since the commit production runs?
        id: scope
        if: steps.tip.outputs.go == 'true'
        env:
          LIVE: ${{ steps.live.outputs.api_commit }}
          LIVE_VERSION: ${{ steps.live.outputs.api_version }}
        run: |
          # Fails toward deploying: no live API, or a live commit this clone does not hold.
          paths=(workers/api crates Cargo.toml Cargo.lock rust-toolchain.toml)
          if [ -z "$LIVE_VERSION" ]; then
            changed=true; why="no bakery-api yet: the first deploy"
          elif [ -z "$LIVE" ] || ! git cat-file -e "$LIVE^{commit}" 2> /dev/null; then
            changed=true; why="the live deployment names no commit this clone holds"
          elif git diff --quiet "$LIVE" HEAD -- "${paths[@]}"; then
            changed=false; why="nothing under ${paths[*]} changed since main@${LIVE:0:8}"
          else
            changed=true; why="changed since main@${LIVE:0:8}"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "API: $why" >> "$GITHUB_STEP_SUMMARY"
          # A Durable Object class lifecycle change (a class bound, exported, renamed or deleted)
          # is a rollback boundary, so it ships alone (ADR 0011, decision 9).
          alone=false
          if [ "$changed" = true ] && [ -n "$LIVE" ] && git cat-file -e "$LIVE^{commit}" 2> /dev/null; then
            git show "$LIVE:workers/api/wrangler.jsonc" > "$RUNNER_TEMP/live.jsonc"
            if ! node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              import { durableObjectClasses } from './scripts/api-deploy-config.mjs';
              const [a, b] = [process.argv[1], 'workers/api/wrangler.jsonc'].map((f) => durableObjectClasses(readFileSync(f, 'utf8')));
              process.exit(JSON.stringify(a) === JSON.stringify(b) ? 0 : 1);
            " "$RUNNER_TEMP/live.jsonc"; then
              alone=true
              others="$(git diff --name-only "$LIVE" HEAD | grep -vE '^(workers/api/|crates/|docs/|Cargo\.(toml|lock)$)' || true)"
              if [ -n "$others" ]; then
                echo "::error::a Durable Object class change ships alone, and this range also changes: $(echo "$others" | tr '\n' ' ')"
                exit 1
              fi
              echo "A Durable Object class change: the API deploys alone, the web stage waits for the next merge." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "alone=$alone" >> "$GITHUB_OUTPUT"
      - name: Stage 1, the API, deployed from the scanned bundle
        id: api
        if: steps.tip.outputs.go == 'true' && steps.scope.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # rule 2
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Every API deploy restarts every object and drops every kitchen socket; the boards
          # reconnect and take a snapshot (delivery.md, "The API").
          pnpm exec wrangler deploy --config workers/api/dist/wrangler.json --no-bundle \
            --message "main@$SHA" --var "BUILD_COMMIT:$SHA" | tee "$RUNNER_TEMP/api-deploy.log"
          version="$(grep -oE 'Current Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/api-deploy.log" | awk '{ print $4 }' | tail -n 1)"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bakery-api deployed: ${version:-see the log} (main@${SHA:0:8})" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage 1's check, health and CORS through the API's hostname
        if: steps.api.outputs.deployed == 'true'
        env:
          LIVE_VERSION: ${{ steps.live.outputs.api_version }}
        run: |
          api=https://api.bakery.ihaveasegway.com
          # A first attach of the Custom Domain waits on DNS and a certificate, which took more than
          # two minutes on 2026-11-06 (Incident #41): ten minutes then, two otherwise.
          if [ -z "$LIVE_VERSION" ]; then tries=300 minutes=ten; else tries=60 minutes=two; fi
          commit=""
          for i in $(seq 1 "$tries"); do
            commit="$(curl -sS "$api/v1/health" | jq -r '.commit // empty' 2> /dev/null || true)"
            [ "$commit" = "$SHA" ] && break
            if [ $((i % 15)) -eq 0 ]; then
              echo "waiting for $api: $(date -u +%H:%M:%S), last: ${commit:-nothing}"
            fi
            sleep 2
          done
          if [ "$commit" != "$SHA" ]; then
            echo "::error::/v1/health reports ${commit:-nothing}, not $SHA, after $minutes minutes"
            exit 1
          fi
          allow="$(curl -sS -o /dev/null -D - -H 'Origin: https://bakery.ihaveasegway.com' "$api/v1/health" | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d ' ' -f 2-)"
          if [ "$allow" != "https://bakery.ihaveasegway.com" ]; then
            echo "::error::the storefront's origin got Access-Control-Allow-Origin '$allow'"
            exit 1
          fi
          if curl -sS -o /dev/null -D - -H 'Origin: https://example.com' "$api/v1/health" | grep -qi '^access-control-'; then
            echo "::error::another origin got a CORS header"
            exit 1
          fi
          echo "bakery-api answers with main@${SHA:0:8} and exact CORS" >> "$GITHUB_STEP_SUMMARY"
      # The startup budget (delivery.md, "Quality gates"): Cloudflare's own figure, which Wrangler
      # prints as "Worker Startup Time: <n> ms". A deploy is live before this can run, so a figure
      # over 500 ms fails the job after the fact, prod-verdict opens an Incident with the rollback
      # command, and the response is operations.md's rollback runbook. A missing line warns.
      - name: Stage 1's startup time, from the deploy's own output (budget 500 ms)
        if: steps.api.outputs.deployed == 'true'
        run: |
          budget=500
          startup="$(grep -oE 'Worker Startup Time: [0-9]+ ms' "$RUNNER_TEMP/api-deploy.log" | awk '{ print $4 }' | tail -n 1 || true)"
          if [ -z "$startup" ]; then
            echo "::warning::the API's deploy printed no 'Worker Startup Time' line, so its startup budget was not checked (Wrangler's wording may have changed)"
            echo "bakery-api startup time: not reported by Wrangler, so not checked" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "bakery-api startup time: $startup ms (budget $budget ms)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$startup" -gt "$budget" ]; then
            echo "::error::bakery-api, now live, starts in $startup ms, over the startup budget of $budget ms; roll it back (docs/operations.md, \"Rollback\")"
            exit 1
          fi
          echo "bakery-api starts in $startup ms; the budget is $budget ms"
      - name: Stage 2, the web Worker, uploaded, smoked on its Version URL, then promoted
        id: web
        if: steps.tip.outputs.go == 'true' && steps.scope.outputs.alone != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # rule 2
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_VERSION: ${{ steps.live.outputs.web_version }}
        run: |
          config=apps/web/wrangler.jsonc
          # The startup budget (delivery.md, "Quality gates"): Wrangler prints Cloudflare's figure as
          # "Worker Startup Time: <n> ms". Over 500 ms fails; a missing line warns. `wrangler deploy`
          # leaves the line out when the figure is 0, so a first deploy may warn.
          startup_check() {
            local budget=500 startup
            startup="$(grep -oE 'Worker Startup Time: [0-9]+ ms' "$RUNNER_TEMP/web.log" | awk '{ print $4 }' | tail -n 1 || true)"
            if [ -z "$startup" ]; then
              echo "::warning::the web Worker's $1 printed no 'Worker Startup Time' line, so its startup budget was not checked (Wrangler's wording may have changed)"
              echo "bakery-web startup time: not reported by Wrangler, so not checked" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "bakery-web startup time: $startup ms (budget $budget ms)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$startup" -gt "$budget" ]; then
              echo "::error::the web Worker's $1 reports a startup time of $startup ms, over the startup budget of $budget ms"
              return 1
            fi
            echo "bakery-web starts in $startup ms; the budget is $budget ms"
          }
          late_check=false
          if [ -z "$LIVE_VERSION" ]; then
            # The first deploy: routes and Custom Domains are not part of a version (delivery.md).
            pnpm exec wrangler deploy --config "$config" --message "main@$SHA" | tee "$RUNNER_TEMP/web.log"
            version="$(grep -oE 'Current Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/web.log" | awk '{ print $4 }' | tail -n 1)"
            late_check=true # live already: checked after the outputs are written
          else
            pnpm exec wrangler versions upload --config "$config" --tag "${SHA:0:8}" --message "main@$SHA" | tee "$RUNNER_TEMP/web.log"
            version="$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/web.log" | awk '{ print $4 }' | tail -n 1)"
            preview="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/web.log" | head -n 1)"
            if [ -z "$version" ] || [ -z "$preview" ]; then
              echo "::error::the upload reported no version id or Version URL (confirm Wrangler's output on launch day)"
              exit 1
            fi
            if ! startup_check upload; then
              echo "::error::nothing was promoted; bakery-web stays at ${LIVE_VERSION}"
              exit 1
            fi
            # The Version URL smoke: each page answers 200 with the policy, and is the artifact.
            for page in / /menu/ /catering/ /checkout/ /privacy/ /signin/; do
              file="apps/web/dist${page}index.html"
              code="$(curl -sS -o "$RUNNER_TEMP/page.html" -D "$RUNNER_TEMP/page.headers" -w '%{http_code}' "$preview$page")"
              if [ "$code" != 200 ] || ! cmp -s "$RUNNER_TEMP/page.html" "$file" ||
                ! tr -d '\r' < "$RUNNER_TEMP/page.headers" | grep -qi '^content-security-policy:'; then
                echo "::error::the Version URL's $page answered $code, or differs from the artifact, or has no policy; nothing was promoted"
                exit 1
              fi
            done
            tip="$(git ls-remote origin refs/heads/main | cut -f 1)"
            if [ "$tip" != "$SHA" ]; then
              echo "::notice::main moved to ${tip:0:12} during the deploy; its own run promotes it."
              exit 0
            fi
            pnpm exec wrangler versions deploy "$version@100%" --name bakery-web --message "main@$SHA" --yes
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bakery-web deployed: $version (was ${LIVE_VERSION:-none})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$late_check" = true ] && ! startup_check deploy; then
            echo "::error::bakery-web is live with it; roll it back or fix forward (docs/operations.md, \"Rollback\")"
            exit 1
          fi

  rollback:
    # workflow_dispatch from main with worker, rollback_to and reason (docs/operations.md,
    # "Rollback"); in deploy's group, so it never races a deploy. Only a version id.
    if: vars.LAUNCHED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      worker: ${{ steps.inputs.outputs.worker }}
      before: ${{ steps.rollback.outputs.before }}
      to: ${{ steps.inputs.outputs.to }}
    steps:
      - name: Check the inputs, a Worker and a version id and nothing else
        id: inputs
        env:
          # Rule 3: dispatch text reaches the script through env only.
          WORKER: ${{ inputs.worker }}
          TO: ${{ inputs.rollback_to }}
          REASON: ${{ inputs.reason }}
        run: |
          case "$WORKER" in web | api) ;; *) echo "::error::worker is web or api"; exit 1 ;; esac
          if ! printf '%s' "$TO" | grep -Eqx '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'; then
            echo "::error::rollback_to is a version id (a UUID), from the prod-verdict issue or a deploy summary"
            exit 1
          fi
          if [ -z "$REASON" ] || [ "${#REASON}" -gt 200 ] || printf '%s' "$REASON" | grep -q '[^[:print:]]'; then
            echo "::error::reason is one line of at most 200 printable characters"
            exit 1
          fi
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # rule 11
      - run: pnpm install --frozen-lockfile
      - name: Roll back
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # rule 2
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAME: bakery-${{ steps.inputs.outputs.worker }}
          TO: ${{ steps.inputs.outputs.to }}
          REASON: ${{ inputs.reason }}
        run: |
          before="$(pnpm exec wrangler deployments list --name "$NAME" --json | jq -r 'sort_by(.created_on) | last | .versions[0].version_id // empty')"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler rollback "$TO" --name "$NAME" --message "rollback: $REASON" --yes
          {
            echo "$NAME rolled back from ${before:-unknown} to $TO: $REASON"
            echo
            echo "A rollback undoes code, not data. Cloudflare refuses a rollback of bakery-api across a"
            echo "Durable Object class change (created, deleted, renamed or transferred): if it refused, set"
            echo "the API to read-only or off with L1 in Control's flags and fix forward (operations.md,"
            echo "\"Rollback\"). Fix or revert on main next, since the next merge deploys main again."
          } >> "$GITHUB_STEP_SUMMARY"

  prod-smoke:
    # docs/delivery.md's smoke table through both hostnames, in Playwright's image, after deploy or
    # rollback (apps/web/e2e/prod/). After a deploy it also compares every page with the artifact,
    # and /v1/health with this commit when the API deployed.
    needs: [deploy, rollback]
    if: >-
      always() && vars.LAUNCHED == 'true' &&
      ((needs.deploy.result == 'success' && needs.deploy.outputs.ran == 'true') ||
      needs.rollback.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # rule 9; a first attach may wait ten minutes for both hostnames
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - if: needs.deploy.outputs.web == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - name: Smoke production through the zone
        working-directory: apps/web
        env:
          SMOKE_TARGET: production
          SMOKE_COMMIT: ${{ needs.deploy.outputs.api == 'true' && github.sha || '' }}
          # Ten minutes for both hostnames to answer on a first attach (Incident #41), else two.
          SMOKE_WAIT_MS: ${{ needs.deploy.outputs.first_attach == 'true' && '600000' || '120000' }}
          WEB_DEPLOYED: ${{ needs.deploy.outputs.web }}
        run: |
          if [ "$WEB_DEPLOYED" = true ]; then export SMOKE_DIST="$PWD/dist"; fi
          pnpm exec playwright test --config e2e/prod/playwright.config.ts
      - name: Keep the traces of a failed smoke
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-smoke
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  prod-verdict:
    # When prod-smoke fails, or the API's own check after its deploy does: an Incident issue with
    # the exact rollback command for each Worker that changed. On the runner, with the GitHub
    # token only.
    needs: [deploy, rollback, prod-smoke]
    if: >-
      always() && vars.LAUNCHED == 'true' &&
      (needs.prod-smoke.result == 'failure' ||
      (needs.deploy.result == 'failure' && needs.deploy.outputs.api == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the Incident issue
    steps:
      - name: Open an Incident issue with the exact rollback command
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          API_DEPLOYED: ${{ needs.deploy.outputs.api }}
          API_BEFORE: ${{ needs.deploy.outputs.api_before }}
          WEB_DEPLOYED: ${{ needs.deploy.outputs.web }}
          WEB_BEFORE: ${{ needs.deploy.outputs.web_before }}
          RB_WORKER: ${{ needs.rollback.outputs.worker }}
          RB_BEFORE: ${{ needs.rollback.outputs.before }}
          RB_TO: ${{ needs.rollback.outputs.to }}
        run: |
          short="${SHA:0:8}"
          command() { # worker version reason
            echo '```sh'
            echo "gh workflow run ci.yml --repo $REPO --ref main -f worker=$1 -f rollback_to=$2 -f reason=\"$3\""
            echo '```'
          }
          {
            if [ "$EVENT" = workflow_dispatch ]; then
              title="Incident: prod-smoke failed after rolling back bakery-$RB_WORKER to $RB_TO"
              echo "prod-smoke failed after a rollback of bakery-$RB_WORKER to $RB_TO ($RUN)."
              echo
              if [ -n "$RB_BEFORE" ]; then
                echo "The version live before the rollback was $RB_BEFORE. To return to it:"
                command "$RB_WORKER" "$RB_BEFORE" "rollback smoke failed"
              fi
            else
              title="Incident: prod-smoke failed on main@$short"
              echo "prod-smoke failed after the deploy of main@$short ($RUN)."
              echo
              if [ "$API_DEPLOYED" = true ]; then
                echo "bakery-api changed. Roll it back to the version live before (deployed first, so roll it back last):"
                command api "${API_BEFORE:-<no earlier version: the first deploy; fix forward>}" "prod-smoke failed on main@$short"
              fi
              if [ "$WEB_DEPLOYED" = true ]; then
                echo "bakery-web changed. Roll it back to the version live before:"
                command web "${WEB_BEFORE:-<no earlier version: the first deploy; fix forward>}" "prod-smoke failed on main@$short"
              fi
            fi
            echo
            echo "A rollback of bakery-api is refused across a Durable Object class change: then set the API"
            echo "to read-only or off with L1 and fix forward (docs/operations.md, \"Rollback\")."
            echo "Close this issue with the cause and the check that would have caught it."
          } > "$RUNNER_TEMP/body.md"
          labels=()
          if gh label list --repo "$REPO" --search incident --json name --jq '.[].name' | grep -qx incident; then
            labels=(--label incident)
          fi
          gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md" "${labels[@]}"
