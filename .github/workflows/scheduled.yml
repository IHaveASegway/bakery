# The scheduled jobs (docs/delivery.md, "From launch"; docs/operations.md, "The nightly wipe"):
# bakery-objects, the morning object check after the 10:00 UTC wipe (the baseline run at 04:47
# before it; at 12:17, the comparison and the dead-letter and breaker checks), audit, the
# Monday audit, and smokes, the Monday and Thursday run of every scripts/smoke-*.sh (since
# 2026-11-09).
#
# A scheduled run does nothing unless the repository variable LAUNCHED is 'true' (Settings,
# Secrets and variables, Actions, Variables), set on launch day, 2026-11-06. A run started by hand
# (workflow_dispatch) runs the chosen job whatever LAUNCHED says, so any can be tried at any
# time: audit and smokes need no secret; bakery-objects needs CLOUDFLARE_READ_TOKEN and
# CLOUDFLARE_ACCOUNT_ID and stops with an error without them. Against an account where the API
# was never deployed it answers "nothing listed holds data", which is also what a wiped account
# answers: the dry run proves the token and the listing, not the wipe.
#
# Secrets, by name only, in the env of the one step that uses them (rule 2):
#   CLOUDFLARE_READ_TOKEN, CLOUDFLARE_ACCOUNT_ID (docs/operations.md, step 8): bakery-objects'
#     listing. The read token is its own, so a scheduled job never holds write access: Account,
#     Workers Scripts Read (Durable Object namespaces and their objects are listed under it;
#     confirm the name on launch day). It has no analytics permission, by design: the 12:17 run's
#     dead-letter step reads the public GET /v1/status, which needs no secret at all.
# The GitHub token: issues: write for every job's issues, actions: read for bakery-objects to fetch
# the baseline run's listing, pull-requests: read and security-events: read for audit's
# Dependabot state.
#
# The times are off the hour (delivery.md: GitHub delays and drops runs at the top of it).
name: scheduled

on:
  schedule:
    # bakery-objects' baseline run: what holds data before the 10:00 UTC wipe. At 04:47, five hours
    # early, because GitHub started the 09:47 runs of 2026-11-06 to 2026-11-08 at 15:55 to 16:56 UTC,
    # after the wipe; the run records its real start time and the 12:17 run checks it.
    - cron: '47 4 * * *'
    - cron: '17 12 * * *' # bakery-objects: what still holds data after the wipe and its retries
    - cron: '17 7 * * 1' # audit: Monday
    # smokes: Monday and Thursday 17:37, five hours after the 12:17 run and eleven before the next
    # 04:47 one, so a run of under an hour, even one GitHub starts late, seldom holds the shared
    # group then. Monday too because the bakery is closed that day and the seed and several rules
    # behave differently: the first run found a Monday-only failure (smoke-dispatch.sh, 2026-11-09)
    # that a Thursday-only job would never have caught.
    - cron: '37 17 * * 1'
    - cron: '37 17 * * 4'
  workflow_dispatch:
    inputs:
      job:
        description: The job to run now
        type: choice
        options: [bakery-objects, audit, smokes]
        required: true

permissions: {} # rule 1

concurrency:
  group: scheduled # delivery.md: the scheduled jobs share one group, and none is cancelled
  cancel-in-progress: false

jobs:
  bakery-objects:
    # Each Durable Object namespace of bakery-api, listed through the account API with the read
    # token (scripts/bakery-objects.mjs). The API gives an object's id and whether it holds data,
    # never its age, so the baseline run (04:47) keeps a listing and the 12:17 run compares with it:
    # an object that held data before the wipe and still does after it survived the wipe. Objects
    # holding data at 12:17 that were not in the baseline listing are visitors' new sandboxes. The
    # baseline keeps its real start time too: GitHub can start a scheduled run hours late, and a
    # baseline taken after the wipe proves nothing, so the 12:17 run then says so and counts every
    # object holding data, as when no baseline exists. Ids
    # never reach a log, an artifact or an issue, which are public here: only classes, counts and
    # hashes do.
    if: >-
      (vars.LAUNCHED == 'true' &&
      (github.event.schedule == '47 4 * * *' || github.event.schedule == '17 12 * * *')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'bakery-objects')
    runs-on: ubuntu-latest
    timeout-minutes: 10 # rule 9
    permissions:
      contents: read
      actions: read # the baseline listing, an artifact of that run
      issues: write # "Objects survived the wipe", "Messages dead-lettered", "Breaker tripped"
    env:
      PHASE: ${{ github.event.schedule == '47 4 * * *' && 'before' || 'after' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # the script has no dependencies
      - name: Today's baseline listing, from the run that made it
        id: before
        if: env.PHASE == 'after'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          day="$(date -u +%F)"
          found=false
          for run in $(gh run list --repo "$REPO" --workflow scheduled.yml --event schedule \
            --status success --created ">=$day" --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" --repo "$REPO" --name "objects-before-$day" --dir "$RUNNER_TEMP/before" 2> /dev/null; then
              found=true
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" != true ]; then
            echo "::warning::No baseline listing for $day: an object holding data now cannot be told from a sandbox made after the wipe."
            exit 0
          fi
          # The baseline's real start time (UTC HH:MM). One taken at or after the 10:00 wipe, or one
          # that does not say when it was taken, is no baseline: nothing is compared with it.
          taken="$(grep -oxE '[0-2][0-9]:[0-5][0-9]' "$RUNNER_TEMP/before/taken-at.txt" 2> /dev/null || true)"
          echo "taken=${taken:-unknown}" >> "$GITHUB_OUTPUT"
          if [ -z "$taken" ] || [ "$taken" \> "09:59" ]; then
            echo "late=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The baseline run for $day started at ${taken:-an unknown time} UTC, not before the 10:00 wipe, so it is not compared with: an object holding data now cannot be told from a sandbox made after the wipe."
          else
            echo "late=false" >> "$GITHUB_OUTPUT"
          fi
      - name: List every namespace's objects (the read token)
        id: list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }} # rule 2: this step only
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE_FOUND: ${{ steps.before.outputs.found }}
          BEFORE_LATE: ${{ steps.before.outputs.late }}
        run: |
          started="$(date -u +%H:%M)" # the run's real start, near enough: the steps before take seconds
          args=(--out "$RUNNER_TEMP/listing.json")
          if [ "$BEFORE_FOUND" = true ] && [ "$BEFORE_LATE" = false ]; then
            args+=(--before "$RUNNER_TEMP/before/listing.json")
          fi
          set +e
          node scripts/bakery-objects.mjs "${args[@]}" > "$RUNNER_TEMP/summary.json"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then exit 1; fi # the listing failed: never read as a clean wipe
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT" # the 12:17 run looks for this day's listing
          echo "$started" > "$RUNNER_TEMP/taken-at.txt" # kept with the baseline listing
          if [ "$PHASE" = before ] && [ "$started" \> "09:59" ]; then
            echo "::warning::this baseline run started at $started UTC, not before the 10:00 wipe; the 12:17 run will not compare with it"
          fi
          {
            echo "Phase: $PHASE (UTC $started)"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the baseline listing and its start time for the 12:17 run (hashes and counts only)
        if: env.PHASE == 'before'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: objects-before-${{ steps.list.outputs.day }}
          path: |
            ${{ runner.temp }}/listing.json
            ${{ runner.temp }}/taken-at.txt
          retention-days: 2
      - name: Open or update the issue when an object survived the wipe
        if: env.PHASE == 'after' && steps.list.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BEFORE_FOUND: ${{ steps.before.outputs.found }}
          BEFORE_LATE: ${{ steps.before.outputs.late }}
          BEFORE_TAKEN: ${{ steps.before.outputs.taken }}
        run: |
          title="Objects survived the wipe"
          survivors="$(jq -r '.survivors | to_entries | map("\(.key): \(.value)") | join(", ")' "$RUNNER_TEMP/summary.json")"
          {
            echo "$(date -u +%F), the 12:17 UTC check ($RUN):"
            echo
            if [ "$BEFORE_FOUND" = true ] && [ "$BEFORE_LATE" = false ]; then
              echo "Objects that held data in the baseline run ($BEFORE_TAKEN UTC) and still do after the 10:00 wipe, by class: $survivors."
            elif [ "$BEFORE_FOUND" = true ]; then
              echo "The baseline was taken after the wipe: its run started at $BEFORE_TAKEN UTC, so nothing was compared with it, and every object holding data is counted, by class: $survivors."
              echo "Some may be sandboxes made after the wipe."
            else
              echo "No baseline listing to compare with, so every object holding data is counted, by class: $survivors."
              echo "Some may be sandboxes made after the wipe."
            fi
            echo
            echo "Runbook: docs/operations.md, \"The nightly wipe\". The objects' ids are in the dashboard, not here."
          } > "$RUNNER_TEMP/body.md"
          number="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          echo "::error::an object survived the wipe: $survivors"
          exit 1

      - name: Open or update the issue when a message was dead-lettered (the public status route)
        # The 12:17 run only: the count is a 24-hour one, so once a day is enough. It runs even when
        # the survivors step above failed, so neither finding hides the other. No secret: the Worker's
        # own 15-minute refresh puts counters.dlq_24h on GET /v1/status (docs/operations.md,
        # "Observability"). The issue holds a count and times, never an object or sandbox id.
        if: ${{ !cancelled() && env.PHASE == 'after' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_URL: https://api.bakery.ihaveasegway.com/v1/status # prod-smoke's API hostname
        run: |
          status="$RUNNER_TEMP/status.json"
          if ! curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 \
            --output "$status" "$STATUS_URL"; then
            echo "Dead-letter check: could not fetch the status route, so the count is unknown. The API being down is prod-smoke's finding; look at this run." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the dead-letter check could not fetch $STATUS_URL"
            exit 1
          fi
          if ! jq -e '(.counters_state | type) == "string"' "$status" > /dev/null 2>&1; then
            echo "Dead-letter check: the status route answered without a counters_state." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the status route answered without a counters_state"
            exit 1
          fi
          state="$(jq -r '.counters_state' "$status")"
          case "$state" in
            unavailable)
              echo "Dead-letter check: counters unavailable (no analytics snapshot yet or the refresh is failing), so no count was read and nothing was opened. See the status incident runbook in docs/operations.md." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            live | stale) ;;
            *)
              echo "Dead-letter check: unknown counters_state." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::the status route answered an unknown counters_state"
              exit 1
              ;;
          esac
          if ! jq -e '(.counters.dlq_24h | type) == "number" and .counters.dlq_24h >= 0 and (.counters.dlq_24h | floor) == .counters.dlq_24h' "$status" > /dev/null 2>&1; then
            echo "Dead-letter check: counters_state is $state but counters.dlq_24h is not a count." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::counters.dlq_24h is not a count"
            exit 1
          fi
          count="$(jq -r '.counters.dlq_24h' "$status")"
          # Only a plain timestamp reaches the issue; anything else is shown as unknown.
          as_of="$(jq -r 'if (.counters_as_of | type) == "string" and (.counters_as_of | test("^[0-9T:.Z+-]{10,40}$")) then .counters_as_of else "unknown" end' "$status")"
          echo "Dead-letter check: $count dead-lettered in the last 24 hours (counters $state, as of $as_of)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then exit 0; fi
          title="Messages dead-lettered"
          {
            echo "$(date -u +%F), the 12:17 UTC check ($RUN):"
            echo
            echo "$count dead-lettered in the last 24 hours (the \`dlq\` points counted on the public status route; counters $state, as of $as_of)."
            if [ "$state" = stale ]; then
              echo "The counters are stale: the count may be out of date."
            fi
            echo
            echo "Runbook: docs/operations.md, \"A dead-lettered message\". The Queues screen (bakery-events-dlq) and the owning Sandbox's dead letters show which messages; they are not named here."
          } > "$RUNNER_TEMP/dlq-body.md"
          number="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/dlq-body.md"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/dlq-body.md"
          fi
          echo "::error::$count message(s) dead-lettered in the last 24 hours"
          exit 1

      - name: Open or update the issue when the breaker has tripped (the public status route)
        # The 12:17 run only, after the dead-letter step and independent of it. No secret: the
        # 15-minute cron's breaker puts its state on GET /v1/status as `breaker` (docs/cost.md,
        # "Guardrails"). A tripped state never relaxes by itself, so the issue stays open until a
        # person resets it (docs/operations.md, "Breaker tripped"). The issue holds a state and
        # times and one dollar figure, never an id.
        if: ${{ !cancelled() && env.PHASE == 'after' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_URL: https://api.bakery.ihaveasegway.com/v1/status # prod-smoke's API hostname
        run: |
          status="$RUNNER_TEMP/breaker-status.json"
          if ! curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 \
            --output "$status" "$STATUS_URL"; then
            echo "Breaker check: could not fetch the status route, so the breaker's state is unknown. The API being down is prod-smoke's finding; look at this run." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the breaker check could not fetch $STATUS_URL"
            exit 1
          fi
          if ! jq -e '(.breaker.state | type) == "string"' "$status" > /dev/null 2>&1; then
            echo "Breaker check: the status route answered without a breaker state." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the status route answered without a breaker state"
            exit 1
          fi
          state="$(jq -r '.breaker.state' "$status")"
          # Only a plain timestamp or dollar figure reaches the issue; anything else is shown as unknown.
          since="$(jq -r 'if (.breaker.since | type) == "string" and (.breaker.since | test("^[0-9T:.Z+-]{10,40}$")) then .breaker.since else "unknown" end' "$status")"
          last_run="$(jq -r 'if (.breaker.last_run | type) == "string" and (.breaker.last_run | test("^[0-9T:.Z+-]{10,40}$")) then .breaker.last_run else "unknown" end' "$status")"
          last_usd="$(jq -r 'if (.breaker.last_usd | type) == "string" and (.breaker.last_usd | test("^[0-9]{1,9}[.][0-9]{1,6}$")) then .breaker.last_usd else "unknown" end' "$status")"
          case "$state" in
            armed)
              echo "Breaker check: armed, last run $last_run (last window priced \$$last_usd). Nothing opened." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            unconfigured)
              echo "Breaker check: unconfigured. The breaker has not run with its secrets yet (BREAKER_API_TOKEN, BREAKER_ZONE_ID, BREAKER_RULE_ID); nothing is watching usage. See docs/operations.md." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            read-only | off) ;;
            *)
              echo "Breaker check: unknown breaker state." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::the status route answered an unknown breaker state"
              exit 1
              ;;
          esac
          echo "Breaker check: TRIPPED, $state since $since (last run $last_run, last window priced \$$last_usd)." >> "$GITHUB_STEP_SUMMARY"
          title="Breaker tripped"
          {
            echo "$(date -u +%F), the 12:17 UTC check ($RUN):"
            echo
            echo "The breaker is **$state**, since $since. Its last run was at $last_run and priced that window at \$$last_usd."
            if [ "$state" = off ]; then
              echo "The demo is switched off and the pre-built WAF rule on the API hostname has been enabled (or is being retried every 15 minutes)."
            else
              echo "The demo is read-only. If the next window is still over a line, the breaker goes to off and enables the WAF rule."
            fi
            echo
            echo "Runbook: docs/operations.md, \"Breaker tripped\". A tripped state never lowers by itself: a person finds the cause, resets the state and the flag, and disables the WAF rule."
          } > "$RUNNER_TEMP/breaker-body.md"
          number="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/breaker-body.md"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/breaker-body.md"
          fi
          echo "::error::the breaker is $state since $since"
          exit 1

  audit:
    # The Monday audit (delivery.md, the `scheduled` row): RustSec through cargo audit and cargo
    # deny against the newest database, pnpm audit against the lockfile, the Dependabot state, and
    # both Workers' compatibility_date age. Any finding opens (or updates) one issue, and the job
    # fails; it is green otherwise. Holds no secret.
    if: >-
      (vars.LAUNCHED == 'true' && github.event.schedule == '17 7 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 25 # rule 9: two cargo installs, cold
    permissions:
      contents: read
      issues: write # "Weekly audit"
      pull-requests: read # Dependabot's open pull requests
      security-events: read # Dependabot's alerts, if this token may read them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Rust, from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version
      - name: Cargo tool versions, read from Cargo.toml's [workspace.metadata.tools]
        id: tools
        run: |
          meta="$(cargo metadata --no-deps --format-version 1 --locked)"
          for tool in cargo-audit cargo-deny; do
            version="$(jq -r --arg t "$tool" '.metadata.tools[$t] // empty' <<<"$meta")"
            if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::cannot read an exact version for $tool from [workspace.metadata.tools]"
              exit 1
            fi
            echo "$tool=$version" >> "$GITHUB_OUTPUT"
          done
      - name: Install cargo-audit and cargo-deny (rule 12, --locked and pinned)
        env:
          AUDIT: ${{ steps.tools.outputs.cargo-audit }}
          DENY: ${{ steps.tools.outputs.cargo-deny }}
        run: |
          cargo install cargo-audit --locked --version "$AUDIT"
          cargo install cargo-deny --locked --version "$DENY"
      - name: Audit, each check writing what it found
        run: |
          out="$RUNNER_TEMP/findings"
          mkdir -p "$out"
          set +e
          cargo audit > "$out/cargo-audit.txt" 2>&1 || echo "cargo audit" >> "$out/failed"
          cargo deny check advisories > "$out/cargo-deny.txt" 2>&1 || echo "cargo deny check advisories" >> "$out/failed"
          pnpm audit --audit-level moderate > "$out/pnpm-audit.txt" 2>&1 || echo "pnpm audit (moderate and above)" >> "$out/failed"
          # compatibility_date older than 180 days, per Worker (operations.md, the quarterly bump).
          for config in apps/web/wrangler.jsonc workers/api/wrangler.jsonc; do
            date="$(grep -oE '"compatibility_date": *"[0-9-]{10}"' "$config" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')"
            age=$(( ($(date -u +%s) - $(date -u -d "$date" +%s)) / 86400 ))
            echo "$config: compatibility_date $date, $age days old" >> "$out/compat.txt"
            if [ "$age" -gt 180 ]; then echo "compatibility_date of $config is $age days old" >> "$out/failed"; fi
          done
          exit 0
      - name: The Dependabot state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          out="$RUNNER_TEMP/findings"
          # Dependabot's pull requests open for more than 14 days: a security update merges when CI
          # passes, and majors wait 14 days (delivery.md, "Dependency policy").
          cutoff="$(date -u -d '14 days ago' +%FT%TZ)"
          gh pr list --repo "$REPO" --author 'app/dependabot' --state open --limit 100 \
            --json number,title,createdAt > "$RUNNER_TEMP/dependabot.json"
          stale="$(jq -r --arg c "$cutoff" '[.[] | select(.createdAt < $c)] | map("#\(.number) \(.title)") | join("\n")' "$RUNNER_TEMP/dependabot.json")"
          if [ -n "$stale" ]; then
            printf 'Dependabot pull requests open for more than 14 days:\n%s\n' "$stale" > "$out/dependabot.txt"
            echo "Dependabot pull requests open for more than 14 days" >> "$out/failed"
          fi
          if gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" > "$RUNNER_TEMP/alerts.json" 2> /dev/null; then
            count="$(jq 'length' "$RUNNER_TEMP/alerts.json")"
            echo "Open Dependabot alerts: $count" >> "$out/dependabot.txt"
            if [ "$count" -gt 0 ]; then echo "$count open Dependabot alerts" >> "$out/failed"; fi
          else
            echo "::warning::this token cannot read Dependabot alerts; their state is in the Security tab"
            echo "Dependabot alerts: not readable with the workflow token" >> "$out/dependabot.txt"
          fi
      - name: The storefront's external links (scripts/check-links.mjs, PR 12)
        # The external-link check the old calendar promised: build the storefront, then fetch every
        # link that leaves it (the lab pages, the ADRs, the essay's sources) and record each one
        # that does not answer 2xx as a finding. No secret; the job's contents: read is enough.
        run: |
          out="$RUNNER_TEMP/findings"
          set +e
          if ! { pnpm install --frozen-lockfile && pnpm --filter web build; } > "$RUNNER_TEMP/web-build.log" 2>&1; then
            tail -n 40 "$RUNNER_TEMP/web-build.log"
            echo "the storefront did not build, so its external links were not checked" >> "$out/failed"
            exit 0
          fi
          node scripts/check-links.mjs > "$out/links.txt" 2>&1
          status=$?
          cat "$out/links.txt"
          if [ "$status" -eq 1 ]; then
            grep -E '^- https?://' "$out/links.txt" | sed 's/^- /external link: /' >> "$out/failed"
          elif [ "$status" -ne 0 ]; then
            echo "the external-link check could not run (exit $status)" >> "$out/failed"
          fi
          exit 0
      - name: Open or update the issue on a finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/findings"
          cat "$out/compat.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$out/failed" ]; then
            echo "No finding." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="Weekly audit"
          {
            echo "$(date -u +%F) ($RUN). Findings:"
            echo
            sed 's/^/- /' "$out/failed"
            for f in cargo-audit cargo-deny pnpm-audit dependabot; do
              if [ -s "$out/$f.txt" ]; then
                echo
                echo "<details><summary>$f</summary>"
                echo
                echo '```text'
                tail -n 60 "$out/$f.txt"
                echo '```'
                echo "</details>"
              fi
            done
            echo
            echo "Procedure: docs/operations.md, \"Dependency update\"."
          } > "$RUNNER_TEMP/body.md"
          number="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          echo "::error::the audit found: $(paste -sd ';' "$out/failed")"
          exit 1

  smokes:
    # The Monday and Thursday smokes (delivery.md, the `smokes` row; decided on 2026-11-09, R70):
    # every scripts/smoke-*.sh, one after the other, on `wrangler dev` with the fakes, through
    # scripts/smoke-all.sh, as a person runs them. Not on every pull request: the scripts alone
    # take about 20 minutes. Mondays as well as Thursdays, since the bakery is closed on Mondays and
    # the seed and several rules behave differently then (the cron's comment). Any failed script,
    # or a build that failed before them, opens (or updates) one issue, "Weekly smokes failed" (the
    # title kept from the first, Thursday-only design, so nothing has to find a renamed issue),
    # and fails the job; it is green otherwise, and, as audit
    # does, a green run leaves an open issue for a person to close. Holds no secret: the fakes
    # need none, and the throwaway .dev.vars each script writes holds fake values only.
    if: >-
      (vars.LAUNCHED == 'true' &&
      (github.event.schedule == '37 17 * * 1' || github.event.schedule == '37 17 * * 4')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'smokes')
    runs-on: ubuntu-latest
    # rule 9: the eleven scripts took 20 minutes one after the other on 2026-11-09 (1205 s on a
    # 4-core machine, warm), 30 with half again for a slower runner; the cold toolchain, the
    # worker-build install, pnpm install and the first API and seed builds about 15 more (verify's
    # cold 25 minutes hold all that and the tests); and one hung script's 15 (smoke-all.sh's
    # SMOKE_ALL_TIMEOUT_S, 900 s) on top: 30 + 15 + 15 = 60.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # "Weekly smokes failed"
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # rule 7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # once a week; no cache to keep or trust
      - name: Rust, from rust-toolchain.toml, with the WebAssembly target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo --version
      - name: The worker-build version, read from Cargo.toml's [workspace.metadata.tools]
        id: tools
        run: |
          meta="$(cargo metadata --no-deps --format-version 1 --locked)"
          version="$(jq -r '.metadata.tools["worker-build"] // empty' <<<"$meta")"
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::cannot read an exact version for worker-build from [workspace.metadata.tools]"
            exit 1
          fi
          echo "worker-build=$version" >> "$GITHUB_OUTPUT"
      - name: Install worker-build (rule 12, --locked and pinned)
        env:
          WORKER_BUILD: ${{ steps.tools.outputs.worker-build }}
        run: cargo install worker-build --locked --version "$WORKER_BUILD"
      - run: pnpm install --frozen-lockfile
      - name: Build once what the scripts build, so each script's own build finds it done
        # Each script's `wrangler dev` runs the API's build command (worker-build --release), and
        # smoke-crm.sh and smoke-dispatch.sh build the seed generator; built here, those are no-ops.
        run: |
          (cd workers/api && worker-build --release)
          cargo build -q --locked -p bakery-seed
      - name: Run every smoke script (scripts/smoke-all.sh)
        id: run
        run: |
          set +e
          scripts/smoke-all.sh --logs "$RUNNER_TEMP/smokes" --markdown "$RUNNER_TEMP/smokes.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/smokes.md" ]; then
            cat "$RUNNER_TEMP/smokes.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Open or update the issue when a script failed
        if: ${{ !cancelled() && (failure() || steps.run.outputs.code != '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.run.outputs.code }}
        run: |
          results="$RUNNER_TEMP/smokes/results.tsv"
          title="Weekly smokes failed"
          {
            echo "$(date -u +%F) ($RUN):"
            echo
            if [ -z "$CODE" ]; then
              echo "The smokes did not run: a step before them failed (the toolchain, the install or the build). Its log is in the run."
            elif [ ! -s "$results" ]; then
              echo "scripts/smoke-all.sh stopped before any script (exit $CODE). Its output is in the run."
            else
              echo "Failed:"
              echo
              awk -F '\t' 'NR > 1 && $5 != "pass" { printf "- `%s`: %s, %s (%s s)\n", $1, $5, $6, $4 }' "$results"
              for log in "$RUNNER_TEMP"/smokes/*.log; do
                case "$log" in *.worker.log) continue ;; esac
                if grep -q '^FAIL  ' "$log"; then
                  echo
                  echo "<details><summary>smoke-$(basename "$log" .log).sh, its FAIL lines</summary>"
                  echo
                  echo '```text'
                  grep '^FAIL  ' "$log" | head -n 20 | cut -c1-400
                  echo '```'
                  echo "</details>"
                fi
              done
            fi
            echo
            echo "The logs are the run's \`smoke-logs\` artifact (kept 7 days). Runbook: docs/operations.md, \"Weekly smokes failed\"."
          } > "$RUNNER_TEMP/body.md"
          number="$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          if [ -s "$results" ]; then
            echo "::error::smoke scripts failed: $(awk -F '\t' 'NR > 1 && $5 != "pass" { print $1 }' "$results" | paste -sd ' ')"
          else
            echo "::error::the smokes did not run"
          fi
          exit 1
      - name: Keep the scripts' logs (fakes only, no secret)
        if: ${{ !cancelled() }} # after the issue step too, which fails the job on a failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smokes
          if-no-files-found: ignore
          retention-days: 7 # past the next run
