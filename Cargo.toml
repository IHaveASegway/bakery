# The Cargo workspace (docs/delivery.md, "Repository layout"). The crates exist because their
# dependency rules differ: domain and app depend on no platform crate, and only workers/api
# depends on `worker`.
[workspace]
resolver = "2"
members = ["crates/domain", "crates/app", "crates/seed", "crates/contracts", "workers/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
repository = "https://github.com/IHaveASegway/bakery"

# Exact pins, the latest stable on 2026-11-04 from the crates.io index. Dependabot moves them in
# grouped pull requests, except worker, which moves by hand (docs/delivery.md, "Dependency policy").
[workspace.dependencies]
bakery-domain = { path = "crates/domain" }
bakery-app = { path = "crates/app" }
bakery-seed = { path = "crates/seed" }
bakery-contracts = { path = "crates/contracts" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
thiserror = "=2.0.21"
rand_chacha = { version = "=0.10.0", default-features = false }
rand_core = "=0.10.1"
proptest = "=1.12.0"
# Sign-in (docs/security.md, "Sign-in and sessions"). All RustCrypto or zero-dependency, pure
# Rust, built for wasm32-unknown-unknown with no getrandom backend: randomness comes in as bytes.
# HMAC-SHA256 for the session and OAuth cookies, account ids and IP hashes; replaces nothing.
# MIT OR Apache-2.0. Constant-time verify built in, so no `subtle` of our own.
hmac = "=0.13.0"
# SHA-256 for HMAC, PKCE's S256 and the RS256 digest. MIT OR Apache-2.0.
sha2 = { version = "=0.11.1", default-features = false }
# argon2id for demo passwords, OWASP's m=19456 KiB, t=2, p=1. MIT OR Apache-2.0. The salt is
# ours, so the getrandom default is off.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# RS256 verification of Google's ID tokens, hand-rolled on it (docs/security.md, "Google, with
# the openid scope alone"); jsonwebtoken's backends and ring are what it avoids. MIT OR
# Apache-2.0. 0.9.10 is the latest stable; 0.10 is still a release candidate. Its own sha2
# feature is off: it would pull sha2 0.10, so the DigestInfo prefix is supplied by hand.
rsa = { version = "=0.9.10", default-features = false, features = ["u64_digit"] }
# base64url without padding, and lower-case hex. MIT, no dependencies; replaces base64 and hex.
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
# Test-time RSA keys only (a dev-dependency of bakery-app). rsa 0.9 takes a rand_core 0.6
# generator, older than rand_core 0.10 above, so this is the ChaCha that speaks 0.6; rsa's own
# num-bigint-dig already brings this version. MIT OR Apache-2.0.
rand_chacha_rsa = { package = "rand_chacha", version = "=0.3.1" }
worker = { version = "=0.8.7", features = ["queue"] } # exact: a 0.x minor is a breaking change
# `#[durable_object]` expands to wasm-bindgen paths, so the API names it directly. Pinned to the
# version worker resolves; worker-build fetches the CLI that matches Cargo.lock. Moves with worker.
wasm-bindgen = "=0.2.130"

# Read by one CI step; the single source for cargo-installed tools (delivery rule 12: installs are
# --locked and --version-pinned).
[workspace.metadata.tools]
worker-build = "0.8.7" # the release that matches worker 0.8.7
cargo-deny = "0.20.2"
cargo-audit = "0.22.2"

[profile.release]
opt-level = "s" # size first: size drives startup
lto = true
codegen-units = 1
panic = "abort"
