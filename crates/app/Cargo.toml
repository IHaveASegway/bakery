[package]
name = "bakery-app"
description = "The bakery's use cases and ports. No platform dependency; adapters live in workers/api."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fakes for the ports, for other crates' tests. Never enabled in the Worker.
test-support = []

# No worker, wasm-bindgen, web-sys or getrandom, directly or through another crate: randomness
# arrives as bytes from the Worker (docs/delivery.md, "Quality gates").
[dependencies]
bakery-domain = { workspace = true }
bakery-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
rsa = { workspace = true }
data-encoding = { workspace = true }

[dev-dependencies]
# Test-time RSA keys, for the ID token tests.
rand_chacha_rsa = { workspace = true }
# The seed's menu and open orders, read through the domain's catalog and order rules in
# tests/seed_alignment.rs. bakery-domain cannot take it: the seed depends on the domain.
bakery-seed = { workspace = true }
