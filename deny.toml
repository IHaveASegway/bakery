# cargo-deny 0.20.2: licenses, advisories, bans and sources for the whole workspace
# (docs/delivery.md, "Dependency policy"). A copyleft license, a known advisory or a crate from
# outside crates.io fails CI.

[graph]
# The Worker ships for wasm32; the tests and tools run on the host. Check both.
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# A RustSec vulnerability always fails; so do these.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
  # Marvin, in rsa (every version, no fix released as of 2026-11-05): a timing side channel in
  # private-key operations. bakery-app only verifies Google's RS256 signatures with public keys,
  # and never decrypts or signs outside its tests, which sign with a throwaway key made at test
  # time (docs/security.md, "Google, with the openid scope alone"). Revisit if anything here
  # starts using an RSA private key.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only; Marvin concerns private-key operations" },
]

[licenses]
# Only what the tree needs today. A new license is added here by hand, with a line saying which
# crate brought it.
allow = [
  "MIT",          # most of the tree, and this repository
  "Apache-2.0",   # worker, worker-sys and worker-macros; most dual-licensed crates
  "BSD-3-Clause", # matchit, the router inside worker ("MIT AND BSD-3-Clause")
  "Unicode-3.0",  # the icu_* crates under url's IDNA support, and unicode-ident
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are not published; their MIT license is checked like any other.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry no version; they are never published.
allow-wildcard-paths = true
deny = [
  # Limited wasm32 support; RustCrypto does the same work in pure Rust (docs/stack.md).
  { crate = "ring" },
  # No Tokio of our own: Workers run on the runtime's event loop. worker depends on it with
  # default features off, for its sync primitives, and is the only crate allowed to.
  { crate = "tokio", wrappers = ["worker"] },
]

[bans.build]
# The crates whose build scripts the tree runs today, each accepted for a named reason
# (docs/security.md, "Supply chain"). A new crate with a build.rs fails CI until it is added
# here with its reason. Listed from cargo-deny's own report on 2026-11-09, both targets in [graph].
# cargo-deny allow-lists build scripts only; proc-macros are not covered by this list.
# executables stays "deny": a build script or proc-macro crate that ships a native binary fails.
executables = "deny"
allow-build-scripts = [
  "generic-array",       # brought by digest, under rsa and the hashes in bakery-app
  "getrandom",           # brought by rand, under proptest: tests only
  "icu_normalizer_data", # brought by url's IDNA support, under worker
  "icu_properties_data", # brought by url's IDNA support, under worker
  "libc",                # brought by rustix and tempfile, under proptest: tests only
  "libm",                # brought by num-bigint-dig, under rsa
  "num-bigint-dig",      # brought by rsa, in bakery-app, for RS256 verification
  "num-traits",          # brought by chrono, under worker, and num-bigint-dig, under rsa
  "proc-macro2",         # brought by every derive macro in the tree
  "quote",               # brought by every derive macro in the tree
  "ref-cast",            # brought by schemars, in bakery-contracts
  "rustix",              # brought by tempfile, under proptest: tests only
  "rustversion",         # brought by wasm-bindgen's own build script
  "serde",               # brought by the API, the app and the contracts
  "serde_core",          # brought by serde
  "serde_json",          # brought by the API, the app and the contracts
  "thiserror",           # brought by bakery-app and the crates under it
  "wasm-bindgen",        # brought by worker and the API: the JavaScript boundary
  "wasm-bindgen-shared", # brought by wasm-bindgen
  "zerocopy",            # brought by ppv-lite86, under rand_chacha: tests only
  "zmij",                # brought by serde_json
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
