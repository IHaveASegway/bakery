packages:
  - apps/*

# One version per tool that more than one package uses; a package depends on "typescript": "catalog:".
catalog:
  '@axe-core/playwright': 4.14.0
  '@playwright/test': 1.65.0
  typescript: 6.0.3
  vitest: ^5.0.5
  wrangler: ^4.158.0

# strictDepBuilds is on by default: an install script from any package not listed here fails the install.
allowBuilds:
  esbuild: true
  workerd: true

# minimumReleaseAge stays unset: the pnpm 11 default, 1440 minutes, in loose mode (delivery.md).

# GHSA-g3hv-75wg-m249 (minimatch >=7.0.0 <11.0.1, denial of service by globparts amplification),
# reached only through eslint and @eslint/config-array, dev dependencies of the root. Drop this
# when eslint itself depends on a patched minimatch.
overrides:
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
