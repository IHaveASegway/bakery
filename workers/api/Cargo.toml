[package]
name = "bakery-api"
description = "The Worker bakery-api: the router, the Durable Objects, the cron and Queue handlers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The only crate that depends on the platform. It is a thin adapter over bakery-app.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bakery-app = { workspace = true }
bakery-contracts = { workspace = true }
bakery-domain = { workspace = true }
bakery-seed = { workspace = true }
# Already in the build through bakery-seed: the Simulator draws from the seed's ChaCha, and the
# trait that reads it lives here. No new crate.
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasm-bindgen = { workspace = true }
worker = { workspace = true }
